<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jGoBoard Player Example</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
        background: #f5f0e4;
      }
      #player {
        max-width: 800px;
      }
    </style>
  </head>
  <body>
    <h1>jGoBoard Player</h1>
    <div id="player"></div>

    <!--
      CDN usage: load the UMD bundle. This exposes the global `JGO`.
      If you use the ESM file (`dist/jgoboard.js`), use <script type="module"> + import instead.
    -->
    <script src="https://cdn.jsdelivr.net/npm/jgoboard@5.0.0/dist/jgoboard.umd.min.js"></script>
    <script>
      if (!window.JGO) {
        throw new Error(
          'jGoBoard CDN load failed. Use dist/jgoboard.umd.min.js for global JGO usage.'
        );
      }

      var SGF =
        '(;FF[4]GM[1]SZ[19]PB[Shusaku]BR[7d]PW[Honinbo Shuwa]WR[8d]RE[B+R]' +
        ';B[pd];W[dp]' +
        '(;B[qp];W[dd];B[oq];W[oc])' +
        '(;B[od];W[pq];B[pp]))';

      // The bw-medium theme requires no texture images.
      // Textured themes (kaya/walnut) resolve assets relative to the jGoBoard CDN URL.
      var player = JGO.createPlayer('#player', {
        sgf: SGF,
        theme: 'bw-medium',
        showComments: true,
      });

      player.whenReady();
    </script>
  </body>
</html>
