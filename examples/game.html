<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jGoBoard Game Example</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
        background: #f5f0e4;
      }
      #board {
        max-width: 500px;
      }
      .controls {
        margin: 1rem 0;
        display: flex;
        gap: 0.5rem;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
      }
      #status {
        margin-bottom: 1rem;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <h1>jGoBoard Interactive Game</h1>
    <div id="status">Black to play &mdash; Move 0</div>
    <div id="board"></div>
    <div class="controls">
      <button id="pass">Pass</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="reset">Reset</button>
    </div>

    <!--
      CDN usage: load the UMD bundle. This exposes the global `JGO`.
      If you use the ESM file (`dist/jgoboard.js`), use <script type="module"> + import instead.
    -->
    <script src="https://cdn.jsdelivr.net/npm/jgoboard@5.0.0/dist/jgoboard.umd.min.js"></script>
    <script>
      if (!window.JGO) {
        throw new Error(
          'jGoBoard CDN load failed. Use dist/jgoboard.umd.min.js for global JGO usage.'
        );
      }

      var game = JGO.createGame({
        size: 9,
        rules: JGO.rules.japanese({ ko: 'simple', suicide: 'forbidden' }),
      });

      var renderer = JGO.createRenderer('#board', {
        board: game.board,
        theme: 'bw-medium',
      });

      var status = document.getElementById('status');
      var labels = {};
      labels[JGO.STONE.BLACK] = 'Black';
      labels[JGO.STONE.WHITE] = 'White';

      function updateStatus() {
        var state = game.getState();
        status.textContent =
          labels[state.currentPlayer] + ' to play \u2014 Move ' + state.moveNumber;
      }

      renderer.whenReady().then(function () {
        renderer.render();
      });

      renderer.on('click', function (e) {
        if (!e.vertex) return;
        var result = game.play(e.vertex);
        if (result.ok) updateStatus();
      });

      document.getElementById('pass').addEventListener('click', function () {
        game.pass();
        updateStatus();
      });

      document.getElementById('undo').addEventListener('click', function () {
        if (game.undo().ok) updateStatus();
      });

      document.getElementById('redo').addEventListener('click', function () {
        if (game.redo().ok) updateStatus();
      });

      document.getElementById('reset').addEventListener('click', function () {
        game.reset();
        updateStatus();
      });
    </script>
  </body>
</html>
